<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
    
</head>
<body class="container">
    <form action="" class="form m-2">
        <label for="" class="form-label">Valor A</label> 
        <input type="number" id="v1" class="form-control">
        <label for="" class="form-label">Valor B</label> 
        <input type="number" id="v2" class="form-control">
        <label for="" class="form-label">Operação</label>
        

        <select name="" id="oper" class="form-select">
            <option value="">Soma</option> 
            <option value="">Subtração</option>
            <option value="">Multiplicação</option> 
            <option value="">Divisão</option>
            <option value="">Potência</option>
        </select>
    <a href="#" onclick="executar()" class="btn btn-primary m-2">Executar</a>    
</form>
<div id="resp" class="alert alert-success">O resultado aparece aqui</div>

<script src="script.js"></script>
<script>
    const executar = () => {
        const a = Number(document.getElementById("v1").value);
        const b = Number(document.getElementById("v2").value);
        let oper = document.getElementById("oper").selectedIndex;
        let resultado = (oper==0)?somar(a,b):(oper==1)?subtrair(a,b):(oper==2)?multiplicar(a,b):(oper==3)?dividir(a,b):exponencial(a,b);
        document.getElementById("resp").innerHTML = `O resultado da operação é ${resultado}`;
    }
</script>
</body>
</html>
